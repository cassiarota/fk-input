schema:
  schema_id: fk_nine
  name: FK 九键
  version: '1.0'

engine:
  processors:
    - ascii_composer
    - speller
    - selector
    - navigator
    - express_editor
  segmentors:
    - ascii_segmentor
    - abc_segmentor
    - fallback_segmentor
  translators:
    - script_translator

speller:
  alphabet: '98765432'
  delimiter: " '"
  algebra:
    - xlit/abcdefghijklmnopqrstuvwxyz/22233344455566677778889999/

translator:
  dictionary: pinyin_simp
  enable_user_dict: false
  enable_sentence: true
  enable_completion: true
